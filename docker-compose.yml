# BarBudget — self-hosted stack. Two services only: app + db.
# Exposure to the internet is handled entirely by the host's existing
# cloudflared process (Cloudflare Tunnel), which points a public hostname at
# http://localhost:3000. This stack only publishes the app on 127.0.0.1:3000.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must be present at build time to be inlined into the client
      # bundle. Sourced from .env (compose auto-loads it). Defaults avoid warnings.
      args:
        NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${NEXT_PUBLIC_ADSENSE_CLIENT_ID:-}
        NEXT_PUBLIC_ADSENSE_SLOT_INFEED: ${NEXT_PUBLIC_ADSENSE_SLOT_INFEED:-}
        NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR: ${NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR:-}
        NEXT_PUBLIC_ADSENSE_SLOT_CALCULATOR: ${NEXT_PUBLIC_ADSENSE_SLOT_CALCULATOR:-}
    restart: unless-stopped
    env_file:
      - .env
    # DATABASE_URL is derived at container start from POSTGRES_* (see
    # scripts/db-url.mjs + docker-entrypoint.sh), so a special character in the
    # password can't break it. No need to set it here.
    # Bind ONLY to loopback: reachable by the host's cloudflared, not the LAN/internet.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # busybox wget ships in the node:alpine runtime image.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: unless-stopped
    # Read credentials from .env the SAME way the app does (raw, no compose
    # interpolation), so a special character in the password can't make the
    # value Postgres initializes with differ from the value the app connects
    # with. Both services must agree byte-for-byte.
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` — only the app talks to the db, over the internal Docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
